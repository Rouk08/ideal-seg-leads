services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idealseg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idealseg}
      POSTGRES_DB: ${POSTGRES_DB:-ideal_seg_leads}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432' # exponha só se precisar acessar de fora do docker; pode remover em produção
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-idealseg}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-idealseg}:${POSTGRES_PASSWORD:-idealseg}@postgres:5432/${POSTGRES_DB:-ideal_seg_leads}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
      INVITE_EXPIRES_IN_HOURS: ${INVITE_EXPIRES_IN_HOURS:-72}
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '3333:3333'

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'
    # nginx.conf faz proxy de /api/ pro serviço "backend" acima — front e
    # API ficam na mesma origem, sem precisar mexer em CORS_ORIGIN pra
    # produção. Pra desenvolver com hot-reload, rode o front fora do Docker
    # (veja o README) — este serviço aqui é só pra produção/build estático.

volumes:
  postgres_data:
  uploads_data:
