server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mesma origem pro front e pra API — evita CORS em produção e permite o
    # cookie httpOnly do refresh token funcionar sem configuração extra.
    location /api/ {
        proxy_pass http://backend:3333/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker e manifest nunca devem ficar em cache do navegador —
    # senão uma atualização do app pode não chegar ao vendedor em campo.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA — qualquer rota que não seja um arquivo real cai no index.html
    # (o React Router decide o resto no client).
    location / {
        try_files $uri /index.html;
    }
}
